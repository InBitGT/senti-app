name: Build producción (AAB + IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            ext: aab
          - platform: ios
            ext: ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar EAS CLI
        run: npm install -g eas-cli@latest

      - name: Instalar dependencias
        run: npm ci

      - name: Inyectar variables de entorno en eas.json
        env:
          EXPO_PUBLIC_PRODUCTION_API_URL: ${{ secrets.EXPO_PUBLIC_PRODUCTION_API_URL }}
        run: |
          jq '.build.production.env.EXPO_PUBLIC_PRODUCTION_API_URL = env.EXPO_PUBLIC_PRODUCTION_API_URL' eas.json > eas.tmp.json
          mv eas.tmp.json eas.json

      - name: Build en EAS
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_PRODUCTION_API_URL: ${{ secrets.EXPO_PUBLIC_PRODUCTION_API_URL }}
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile production \
            --non-interactive \
            --wait \
            --json > build.json

          URL=$(jq -r '.[0].artifacts.buildUrl' build.json)
          if [ -z "$URL" ] || [ "$URL" = "null" ]; then
            echo "No se encontró la URL del build"
            cat build.json
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Descargar build
        run: curl -fL "${{ steps.build.outputs.url }}" -o app-production.${{ matrix.ext }}

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-production
          path: app-production.${{ matrix.ext }}
          retention-days: 30
