name: Build producción (AAB + IPA)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            ext: aab
          - platform: ios
            os: macos-latest
            ext: ipa

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Instalar EAS CLI
        run: npm install -g eas-cli@latest

      - name: Instalar dependencias
        run: npm ci

      - name: Build local con EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_PRODUCTION_API_URL: ${{ secrets.EXPO_PUBLIC_PRODUCTION_API_URL }}
        run: |
          eas build \
            --platform ${{ matrix.platform }} \
            --profile production \
            --local \
            --non-interactive \
            --output app-production.${{ matrix.ext }}

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-production
          path: app-production.${{ matrix.ext }}
          retention-days: 30
